<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contract Simulator · Tablero de audiencia y piloto</title>
<style>
:root{
  --canvas:#EEF1EC;--card:#FFFFFF;--ink:#1B2A20;--muted:#5E6E63;--line:#DCE3DA;
  --head:#012614;--brand:#1F5A2E;--lime:#7DB83A;--amber:#E8A33D;--grey:#A9B8AE;--star:#E23B3B;--sel:#0E5FA8;
  --font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--canvas:#EEF1EC}}
:root[data-theme="dark"]{--canvas:#EEF1EC}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
header{background:var(--head);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .star{width:18px;height:18px;background:var(--star);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);flex:none}
header h1{font-size:17px;font-weight:600;margin:0}
header .sub{font-size:12.5px;opacity:.75;margin-left:auto;text-align:right}
.slicers{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.slicer label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{padding:4px 10px;border:1px solid #B9C5BC;border-radius:2px;background:#fff;font-size:12.5px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.reset{margin-left:auto;font-size:12.5px;color:var(--sel);padding:4px 8px}
.ctx{font-size:12px;color:var(--muted);padding:0 20px;margin-top:8px;min-height:16px}
main{padding:10px 20px 90px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.v{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;min-width:0;position:relative}
.v h3{margin:0 0 10px;font-size:13.5px;font-weight:600}
.v .hint{font-size:11.5px;color:var(--muted);margin:-6px 0 8px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.kpi .n{font-size:32px;font-weight:600;line-height:1.1;color:var(--head)}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .s{font-size:12px;margin-top:6px;color:var(--brand);font-weight:600}
.kpi.alert .n{color:#B3261E}
.hb{display:flex;flex-direction:column;gap:5px}
.hr{display:grid;grid-template-columns:minmax(100px,270px) 1fr auto;gap:8px;align-items:center;font-size:12.5px;text-align:left;padding:1px 0;width:100%}
.hr .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr .bar{height:16px;background:#F0F3EF;display:flex;overflow:hidden}
.hr .bar span{height:100%}
.hr .val{text-align:right;min-width:44px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hr.click:hover .bar{outline:1px solid #8FA394}
.hr.dim{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{flex:none}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid #E8ECE7;text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);background:#F7F9F6;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:420px}
.x{color:var(--brand);font-weight:700;text-align:center}
.cell{position:relative}
.cell b{position:relative;z-index:1;font-weight:500}
.cell .bg{position:absolute;left:0;top:3px;bottom:3px;background:#D8EBC4;z-index:0}
.narr{background:#F5F9F1;border-left:4px solid var(--brand)}
.narr p{margin:0 0 8px;font-size:13.5px}
.narr p:last-child{margin:0}
.pend{border:1.5px dashed #B9C5BC;background:#FAFBF9}
.pend .n{color:#9AA79F}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:2px}
.tag.ok{background:#E3F0D3;color:#1F5A2E}.tag.no{background:#FBE3E1;color:#B3261E}.tag.w{background:#FCEFD9;color:#8A5A0B}
.issue{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #E8ECE7}
.issue:last-child{border:0}
.issue .cnt{font-size:24px;font-weight:600;color:#B3261E;text-align:right}
.issue h4{margin:0 0 2px;font-size:13.5px}
.issue p{margin:0;font-size:12.5px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:0 12px calc(env(safe-area-inset-bottom,0px));z-index:6}
nav button{padding:12px 16px;font-size:13px;white-space:nowrap;border-top:3px solid transparent;color:var(--muted)}
nav button.on{border-top-color:var(--brand);color:var(--ink);font-weight:600;background:#F3F7F0}
.src{font-size:11.5px;color:var(--muted);margin-top:12px}
header .hbtns{margin-left:auto;display:flex;gap:8px}
.hbtn[hidden]{display:none}
.hbtn{background:#92D050;color:#012614;font-weight:600;font-size:13px;padding:7px 14px;border-radius:2px}
.hbtn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.datastatus{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:6px 20px;background:#E3F0D3;font-size:12.5px;color:#1F5A2E}
.linkbtn{color:var(--sel);text-decoration:underline;font-size:12.5px}
.loadmsg{padding:0 20px;font-size:13px}.loadmsg:empty{display:none}
.loadmsg.ok,.loadmsg.bad{padding:10px 20px}.loadmsg.ok{background:#F0F8E8;color:#1F5A2E}.loadmsg.bad{background:#FBE3E1;color:#B3261E}
.loadmsg span{color:#5E6E63}
@media (max-width:560px){header{flex-wrap:wrap}header .hbtns{margin-left:0;width:100%}}
@media (max-width:1000px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8,.c6{grid-column:span 12}}
@media (max-width:560px){.c3{grid-column:span 6}.kpi .n{font-size:26px}header .sub{display:none}.slicers{padding:10px 12px}main{padding:10px 12px 90px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

function fnv(s){let h=0x811c9dc5;for(const b of new TextEncoder().encode(String(s).trim().toLowerCase())){h^=b;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,"0")}
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const LK={"totalmente en desacuerdo":1,"en desacuerdo":2,"neutral":3,"ni de acuerdo, ni desacuerdo":3,"ni de acuerdo ni desacuerdo":3,"de acuerdo":4,"totalmente de acuerdo":5};
const likVal=v=>{if(v==null||v==="")return null;if(typeof v==="number")return v>=1&&v<=5?v:null;const k=LK[norm(v)];return k??(isFinite(v)?+v:null)};
const TRIV=new Set(["no","ninguna","ninguno","ok","ok gracias","no por el momento","nada","na","n/a","sin comentarios"]);
const comments=vals=>vals.map(v=>String(v??"").trim()).filter(v=>v&&!TRIV.has(norm(v).replace(/[.!]+$/,"")));
const isEx=v=>/^ejemplo/i.test(String(v??"").trim());
function posNorm(x){x=String(x??"").trim();const n=norm(x);if(n.startsWith("coordinacion")||n.includes("mto"))return "Coordinación MTO";if(n.startsWith("tem")||n.includes("temporal"))return "Conquista temporal";if(n.includes("jefatura"))return "Jefatura Ventas";if(n.includes("conquista"))return "Conquista";return x}
const drNorm=x=>{const n=norm(x).replace(/^dr\s*/,"").replace(/^direccion regional\s*/,"");const m=DRS.find(d=>norm(d)===n);return m||String(x??"").replace(/^DR\s*/,"")};
const gzNorm=x=>String(x??"").replace(/^GZ\s*/,"").trim();
const SHORT_Q=[["para que sirve","Función principal del simulador"],["2 meses","Cliente en SAP con 2 meses de compra"],["prestamos (pt)","Datos a capturar en PT"],["mae","Actualización de cambios en MAE"],["falla","Evidencia para reportar fallas"]];
const SHORT_L=[["negociacion","Mejora y facilita una negociación"],["datos ingresar","Sé qué datos ingresar"],["funcion de la herramienta","Función clara en mi día a día"],["facil de usar","Fácil de usar y navegar"],["claros","Campos claros y fáciles de entender"],["proceso","Proceso claro y aplicable"],["seguro","Me siento seguro(a) usándolo"],["negociacion con el cliente","Información necesaria para negociar"]];
const shortName=(h,list)=>{const n=norm(h);let best=null;for(const [k,v] of list)if(n.includes(k))best=v;return best||String(h).slice(0,70)};

function findHeader(rows,test){for(let i=0;i<Math.min(8,rows.length);i++){const h=(rows[i]||[]).map(x=>x==null?"":String(x).trim());if(test(h.map(norm)))return{h,i}}return null}
const col=(h,...names)=>{const n=h.map(norm);for(const nm of names){const i=n.indexOf(norm(nm));if(i>=0)return i}return -1};
function classify(rows){
  let f;
  if(f=findHeader(rows,h=>(h.includes("cuenta de usuario")||h.includes("user account"))&&h.includes("pvt")))return["piloto",f];
  if(f=findHeader(rows,h=>h.includes("cuenta de usuario")&&h.includes("direccion regional")))return["audiencia",f];
  if(f=findHeader(rows,h=>h.includes("user account")&&h.includes("j2")))return["audiencia",f];
  if(f=findHeader(rows,h=>h.some(x=>x.startsWith("p:"))||h.includes("total points")))return["evaluacion",f];
  if(f=findHeader(rows,h=>h.some(x=>x.startsWith("experiencia general")||x.includes("1 al 10"))))return["feedback",f];
  return[null,null];
}
const body=(rows,i)=>rows.slice(i+1).filter(r=>r&&r.some(v=>v!=null&&v!=="")&&!isEx(r[0]));
function parseAudiencia(rows,{h,i}){
  const raw=h.map(norm).includes("j2");
  const c={acct:col(h,"Cuenta de usuario","User Account"),dr:col(h,"Dirección regional","J2"),gz:col(h,"Gerencia de zona","J3"),pos:col(h,"Posición","Posicion_Esp"),gr:col(h,"Nivel (Job Grade)","Job Grade"),ct:col(h,"Tipo de contrato","Contract Type")};
  if(c.acct<0||c.dr<0||c.pos<0)throw new Error("A la hoja de audiencia le faltan columnas obligatorias.");
  const st=raw?col(h,"Employee Status"):-1;
  return body(rows,i).filter(r=>r[c.acct]&&(st<0||!r[st]||norm(r[st])==="activo")).map(r=>[drNorm(r[c.dr]),gzNorm(r[c.gz]),posNorm(r[c.pos]),String(r[c.gr]??""),String(r[c.ct]??""),0,fnv(r[c.acct])]);
}
function parsePiloto(rows,{h,i}){
  const c={acct:col(h,"Cuenta de usuario","User Account"),name:col(h,"Nombre","Global Display Name"),gz:col(h,"Gerencia de zona","J3"),gr:col(h,"Nivel (Job Grade)","Job Grade")};
  const chs=CH.map(x=>col(h,x));
  return body(rows,i).filter(r=>r[c.acct]).map(r=>[gzNorm(r[c.gz]),String(r[c.name]??""),String(r[c.gr]??""),...chs.map(k=>k>=0&&String(r[k]??"").trim()!==""?1:0),0,fnv(r[c.acct])]);
}
function parseEval(rows,{h,i}){
  const B=body(rows,i),n=h.map(norm);const items=[],ic=[],lik=[],lc=[],wrong={};let cc=-1;
  if(n.includes("total points")){
    h.forEach((x,k)=>{if(!x.startsWith("Points - "))return;const q=x.slice(9);const qi=h.indexOf(q);if(qi<0)return;
      const vals=B.map(r=>r[k]);if(!vals.some(v=>typeof v==="number"))return;
      const nm=shortName(q,SHORT_Q);items.push(nm);ic.push(k);
      const w={};B.forEach(r=>{if(r[k]===0&&r[qi]!=null){w[r[qi]]=(w[r[qi]]||0)+1}});if(Object.keys(w).length)wrong[nm]=w});
    h.forEach((x,k)=>{if(/^(points|feedback) - /i.test(x))return;const vals=B.map(r=>r[k]).filter(v=>v!=null&&v!=="");if(vals.length&&vals.every(v=>typeof v==="string"&&LK[norm(v)]!=null)){lik.push(shortName(x,SHORT_L));lc.push(k)}});
    cc=n.findIndex(x=>x.startsWith("si tienes dudas"));
  }else{
    h.forEach((x,k)=>{if(/^p:/i.test(x)){items.push(x.replace(/^p:\s*/i,""));ic.push(k)}else if(/^l:/i.test(x)){lik.push(x.replace(/^l:\s*/i,""));lc.push(k)}});
    cc=col(h,"Comentario");
  }
  if(!items.length)throw new Error("La hoja de evaluación no tiene preguntas con prefijo “P: ”.");
  const R=B.filter(r=>ic.some(k=>r[k]!=null&&r[k]!==""));
  return{items,rows:R.map(r=>ic.map(k=>+r[k]===1||r[k]===true?1:0)),lik,likRows:R.map(r=>lc.map(k=>likVal(r[k]))),comments:cc>=0?comments(R.map(r=>r[cc])):[],wrong};
}
function parseFeedback(rows,{h,i}){
  const B=body(rows,i),n=h.map(norm);const lik=[],lc=[];let ec=n.findIndex(x=>x.startsWith("experiencia general")||x.includes("1 al 10")),cc;
  const tpl=h.some(x=>/^l:/i.test(x));
  if(tpl){h.forEach((x,k)=>{if(/^l:/i.test(x)){lik.push(x.replace(/^l:\s*/i,""));lc.push(k)}});cc=col(h,"Comentario")}
  else{h.forEach((x,k)=>{const vals=B.map(r=>r[k]).filter(v=>v!=null&&v!=="");if(vals.length&&vals.every(v=>typeof v==="string"&&LK[norm(v)]!=null)){lik.push(shortName(x,SHORT_L));lc.push(k)}});cc=n.findIndex(x=>x.includes("oportunidad"))}
  const R=B.filter(r=>lc.some(k=>r[k]!=null&&r[k]!=="")||(ec>=0&&r[ec]!=null));
  return{lik,rows:R.map(r=>lc.map(k=>likVal(r[k]))),exp:ec>=0?R.map(r=>r[ec]).filter(v=>typeof v==="number"):[],comments:cc>=0?comments(R.map(r=>r[cc])):[]};
}
async function loadFiles(list){
  const nd=JSON.parse(JSON.stringify(D)),found=[],warn=[];
  for(const file of list){
    let sheets;
    try{sheets=/\.csv$/i.test(file.name)?[{name:file.name,rows:readCsv(await file.text())}]:await readXlsx(await file.arrayBuffer())}
    catch(e){warn.push(`${file.name}: ${e.message}`);continue}
    let any=false;
    for(const sh of sheets){
      const [type,hdr]=classify(sh.rows);if(!type)continue;
      try{
        if(type==="audiencia"){const v=parseAudiencia(sh.rows,hdr);if(!v.length)continue;nd.U=v;found.push(`Audiencia: ${v.length} personas`)}
        if(type==="piloto"){const v=parsePiloto(sh.rows,hdr);if(!v.length)continue;nd.P=v;found.push(`Piloto: ${v.length} personas`)}
        if(type==="evaluacion"){const v=parseEval(sh.rows,hdr);if(!v.rows.length)continue;nd.EV=v;found.push(`Evaluación: ${v.rows.length} respuestas`)}
        if(type==="feedback"){const v=parseFeedback(sh.rows,hdr);if(!v.rows.length)continue;nd.FB=v;found.push(`Feedback: ${v.rows.length} respuestas`)}
        any=true;
      }catch(e){warn.push(`${file.name} (${sh.name}): ${e.message}`)}
    }
    if(!any&&!warn.some(w=>w.startsWith(file.name)))warn.push(`${file.name}: no se reconoció ninguna hoja. Usa la plantilla o los archivos originales de Forms.`);
  }
  if(found.length){nd.src=`Datos cargados el ${new Date().toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"})}`;nd.loaded=found;hydrate(nd);try{localStorage.setItem(STORE,JSON.stringify(nd))}catch(e){}}
  return{found,warn};
}

/* ---------- componentes ---------- */
const kpi=(n,l,s,cls="")=>`<div class="v kpi ${cls}"><div class="n">${n}</div><div class="l">${l}</div>${s?`<div class="s">${s}</div>`:""}</div>`;
function hbars(rows,max,opts={}){
  return `<div class="hb">${rows.map(r=>{const segs=r.segs||[[r.value,r.color||"#1F5A2E"]];
    return `<${opts.click?'button':'div'} class="hr ${opts.click?"click":""} ${opts.sel&&opts.sel!==r.label?"dim":""}" ${opts.click?`data-k="${esc(r.label)}" aria-label="${esc(r.label)}: ${r.value}"`:""}><span class="lab" title="${esc(r.label)}">${esc(r.label)}</span><span class="bar">${segs.map(s=>`<span style="width:${max?s[0]/max*100:0}%;background:${s[1]}"></span>`).join("")}</span><span class="val">${r.txt??fmt(r.value)}</span></${opts.click?'button':'div'}>`}).join("")}</div>`;
}
const legend=()=>`<div class="legend">${POS.map(p=>`<span><i style="background:${PC[p]}"></i>${p}</span>`).join("")}</div>`;
function donut(m,keys,colors){
  const tot=keys.reduce((a,k)=>a+(m[k]||0),0);let a0=-Math.PI/2;const R=62,r=40,cx=70,cy=70;
  const arcs=keys.map(k=>{const v=m[k]||0;if(!v)return"";const a1=a0+v/tot*Math.PI*2;const large=a1-a0>Math.PI?1:0;
    const p=(ang,rad)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];
    let d;if(v===tot){d=`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-.01} ${cy-R}L${cx-.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`}
    else{const [x1,y1]=p(a0,R),[x2,y2]=p(a1,R),[x3,y3]=p(a1,r),[x4,y4]=p(a0,r);d=`M${x1} ${y1}A${R} ${R} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${large} 0 ${x4} ${y4}Z`}
    a0=a1;return `<path d="${d}" fill="${colors[k]}"><title>${k}: ${v}</title></path>`}).join("");
  return `<div class="donut"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Distribución">${arcs}<text x="70" y="68" text-anchor="middle" font-size="20" font-weight="600" fill="#1B2A20">${fmt(tot)}</text><text x="70" y="86" text-anchor="middle" font-size="11" fill="#5E6E63">usuarios</text></svg>
   <div>${keys.filter(k=>m[k]).map(k=>`<div style="font-size:12.5px;margin:4px 0"><i style="display:inline-block;width:10px;height:10px;background:${colors[k]};margin-right:6px"></i>${k}: <b>${fmt(m[k])}</b> <span style="color:var(--muted)">(${pct(m[k],tot)})</span></div>`).join("")}</div></div>`;
}

   <div class="c3">${kpi(`${occJp} / ${occJ.length}`,"Jefaturas de Ventas de Occidente en la audiencia",pct(occJp,occJ.length))}</div>
   <div class="c3">${kpi(`${conqP} / ${fmt(conq.length)}`,"Conquista en la audiencia del piloto",pct(conq.length,U.length)+" del universo es Conquista",conqP?"":"alert")}</div>
   <div class="v c6"><h3>Audiencia del piloto por posición</h3>${hbars(posRows,mp)}${lg}</div>
   <div class="v c6"><h3>Audiencia del piloto por dirección regional</h3>${hbars(drRows,md)}${lg}</div>
   <div class="v c12 narr"><h3>Lectura</h3>
    <p>${fmt(totP)} de ${fmt(U.length)} usuarios del universo (${pct(totP,U.length)}) estaban en la audiencia del piloto; ${fmt(U.length-totP)} no. En Occidente, ${occJp} de ${occJ.length} Jefaturas de Ventas estaban convocadas.</p>
    <p>Conquista tiene ${fmt(conq.length)} usuarios y ${conqP} estaban en la audiencia del piloto. Por su función, es probable que trabaje con clientes nuevos (escenario “Cliente Nuevo o Conquista”), el tema con menor acierto en la evaluación del piloto. Conviene priorizarla en la capacitación y en el 1:1.</p></div>
  </div><p class="src">Fuente: ${esc(D.src)}. Cruce por cuenta de usuario entre el universo y la audiencia del piloto.</p>`;
}
function likStats(arr){const v=arr.filter(x=>x!=null);const c=[1,2,3,4,5].map(k=>v.filter(x=>Math.round(x)===k).length);return{n:v.length,c,fav:v.length?(c[3]+c[4])/v.length*100:0,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:0}}
function pResultados(){
  const pend=(t,d)=>`<div class="v kpi pend"><div class="n">—</div><div class="l"><b>${t}</b></div><div class="s" style="color:var(--muted);font-weight:500">${d}</div></div>`;
  if(!EV&&!FB)return `<div class="grid"><div class="v c12 narr"><p>No hay resultados cargados. Usa “Cargar datos” con la plantilla o con los archivos de Forms.</p></div><div class="c3">${pend("Evaluación","Hoja Evaluacion")}</div><div class="c3">${pend("Feedback","Hoja Feedback")}</div></div>`;
  const col=v=>v>=90?"#1F5A2E":v>=80?"#7DB83A":"#E8A33D";const LC=["#B3261E","#E8A33D","#C9D1CB","#7DB83A","#1F5A2E"];
  let html=`<div class="grid">`;let low=[],conf=null,exp=null;
  const conv=P.length;
  if(EV){
    const n=EV.rows.length,mx=EV.items.length,tot=EV.rows.map(r=>r.reduce((a,b)=>a+b,0)),avg=tot.reduce((a,b)=>a+b,0)/n,hi=tot.filter(t=>t>=mx-1).length;
    const it=EV.items.map((l,k)=>{const p=EV.rows.filter(r=>r[k]===1).length/n*100;return{label:l,value:p,segs:[[p,col(p)]],txt:Math.round(p)+" %"}}).sort((a,b)=>b.value-a.value);
    low=[...it].reverse().slice(0,3);
    const dist=[];for(let s=0;s<=mx;s++){const c=tot.filter(t=>t===s).length;if(c)dist.push({label:`${s} de ${mx} puntos`,value:c,txt:`${c} ${c===1?"persona":"personas"}`})}
    const lk=EV.lik.map((l,k)=>{const st=likStats(EV.likRows.map(r=>r[k]));return{label:l,value:st.n,segs:st.c.map((v,i)=>[v,LC[i]]),txt:`${Math.round(st.fav)} % · ${st.avg.toFixed(2)}`}});
    const w=EV.wrong&&low[0]&&EV.wrong[low[0].label];const ww=w?Object.entries(w).sort((a,b)=>b[1]-a[1])[0]:null;
    html+=`<div class="c3">${kpi(fmt(n),"Personas evaluadas",conv?`de ${conv} convocadas (${pct(n,conv)})`:"")}</div>
     <div class="c3">${kpi(`${avg.toFixed(2)} / ${mx}`,"Puntaje promedio de la evaluación",`${pct(hi,n)} obtuvo ${mx-1} o ${mx} puntos`)}</div>`;
    var evBlocks=`<div class="v c7"><h3>Aciertos por pregunta de la evaluación</h3><p class="hint">${n} respuestas. Verde oscuro ≥ 90 %, verde claro 80–89 %, ámbar &lt; 80 %.</p>${hbars(it,100)}
       ${ww?`<p class="src">El error más común en “${esc(low[0].label)}” fue: “${esc(ww[0])}” (${ww[1]} de ${Object.values(w).reduce((a,b)=>a+b,0)} errores).</p>`:""}</div>
     <div class="v c5"><h3>Distribución del puntaje</h3>${hbars(dist,Math.max(...dist.map(d=>d.value)))}
       ${EV.comments.length?`<h3 style="margin-top:18px">Comentarios de la evaluación</h3><ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)">${EV.comments.slice(0,6).map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}</div>
     ${lk.length?`<div class="v ${FB?"c6":"c12"}"><h3>Percepción en la evaluación (n = ${n})</h3><p class="hint">% favorable (de acuerdo y totalmente de acuerdo) · promedio sobre 5.</p>${hbars(lk,Math.max(1,...lk.map(r=>r.value)))}
       <div class="legend">${["Totalmente en desacuerdo","En desacuerdo","Neutral","De acuerdo","Totalmente de acuerdo"].map((l,i)=>`<span><i style="background:${LC[i]}"></i>${l}</span>`).join("")}</div></div>`:""}`;
  }
  let kpis=[];
  if(FB){
    const n=FB.rows.length;const st=FB.lik.map((l,k)=>({l,...likStats(FB.rows.map(r=>r[k]))}));
    const find=re=>st.find(s=>re.test(norm(s.l)));
    const us=find(/facil/),cl=find(/campos|claros/),co=find(/segur/),ne=find(/negoci/);
    conf=co?co.fav:null;exp=FB.exp.length?FB.exp.reduce((a,b)=>a+b,0)/FB.exp.length:null;
    html+=`<div class="c3">${kpi(conf!=null?Math.round(conf)+" %":"–","Seguridad de uso favorable",`Feedback de uso, n = ${n}`,conf!=null&&conf<80?"alert":"")}</div>
     <div class="c3">${kpi(exp!=null?exp.toFixed(1)+" / 10":"–","Experiencia general",`Feedback de uso, n = ${n}`)}</div>`;
    var fbBlock=`<div class="v ${EV&&EV.lik.length?"c6":"c12"}"><h3>Feedback de uso (n = ${n})</h3><p class="hint">% favorable · promedio sobre 5.${n<10?" Muestra pequeña: leer como señal, no como resultado.":""}</p>${hbars(st.map(s=>({label:s.l,value:s.fav,segs:[[s.fav,col(s.fav)]],txt:`${Math.round(s.fav)} % · ${s.avg.toFixed(1)}`})),100)}
       ${FB.comments.length?`<h3 style="margin-top:16px">Oportunidades que señalaron</h3><ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)">${FB.comments.slice(0,6).map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}</div>`;
    const K=(name,meta,val,ok)=>[name,meta,val,ok];
    kpis=[us&&K("Usabilidad favorable","≥90 %",Math.round(us.fav)+" %",us.fav>=90),cl&&K("Claridad de campos","≥90 %",Math.round(cl.fav)+" %",cl.fav>=90),co&&K("Confianza de uso","≥80 %",Math.round(co.fav)+" %",co.fav>=80),ne&&K("Utilidad para negociar","≥80 %",Math.round(ne.fav)+" %",ne.fav>=80),exp!=null&&K("Experiencia general","≥8.5 / 10",exp.toFixed(1)+" / 10",exp>=8.5),conv&&K("Feedback de uso ampliado","≥70 % de la audiencia",`${n} de ${conv} (${pct(n,conv)})`,n/conv>=.7)].filter(Boolean);
  }
  if(!EV)html+=`<div class="c3">${pend("Evaluación","Sin datos cargados")}</div><div class="c3">${pend("Puntaje","Sin datos cargados")}</div>`;
  if(!FB)html+=`<div class="c3">${pend("Seguridad de uso","Sin datos de feedback")}</div><div class="c3">${pend("Experiencia general","Sin datos de feedback")}</div>`;
  html+=(EV?evBlocks:"")+(FB?fbBlock:"");
  if(kpis.length)html+=`<div class="v c12"><h3>KPIs de estabilización sugeridos en el diagnóstico vs. resultado</h3><div class="tw"><table><tr><th>KPI</th><th>Meta sugerida</th><th>Resultado</th><th>Estado</th></tr>${kpis.map(k=>`<tr><td>${k[0]}</td><td>${k[1]}</td><td>${k[2]}</td><td>${k[3]?'<span class="tag ok">Cumple</span>':'<span class="tag no">Por cerrar</span>'}</td></tr>`).join("")}</table></div></div>`;
  html+=`<div class="v c12 narr"><h3>Lectura</h3>${EV?`<p>Los temas con menor acierto son: ${low.map(l=>`${esc(l.label)} (${Math.round(l.value)} %)`).join(", ")}.</p>`:""}${conf!=null?`<p>Seguridad de uso favorable: ${Math.round(conf)} %${conf<80?", por debajo de la meta de 80 %. Prioridad: práctica situacional y refuerzo de los temas con menor dominio.":"."}</p>`:""}<p>Si las respuestas son anónimas, no se pueden cruzar por persona, gerencia de zona o posición.</p></div>`;
  return html+`</div><p class="src">Fuente: ${esc(D.src)}.</p>`;
}
function pCalidad(){
  const orig=D===D0||!D.loaded;const notU=P.filter(p=>!p.inU);
  const occJ=U.filter(r=>r.dr==="Occidente"&&r.pos==="Jefatura Ventas");const occNo=occJ.filter(r=>!r.pil).length;
  const other=[...new Set(U.map(r=>r.pos))].filter(p=>!POS.includes(p));
  const it=[[notU.length,"Personas del piloto fuera del universo",notU.length?notU.map(p=>esc(p.name)).join(", ")+". Confirmar si son bajas o cambios.":"Todas aparecen en el universo."],
   [occNo,"Jefaturas de Occidente fuera de la audiencia del piloto","Están en el universo como Jefatura Ventas de Occidente pero no en la lista del piloto."],
   [other.length,"Posiciones fuera del catálogo",other.length?esc(other.join(", ")):"Todas las posiciones coinciden con el catálogo."]];
  const st=[[22,"Posición con nombres distintos","“Coordinacion Market to Order” (16), “Coordinacion Market to Orr” (5) y “Coordinacion MTO” (1) son la misma posición."],
   [40,"Dirección regional distinta según la columna","J2 y NN03 no coinciden: Oaxaca (25) aparece en Sureste o en Centro; Morelos/Guerrero (14) e Hidalgo (1), en Centro o en Occidente."],
   [3,"Gerencia de zona duplicada","Existen “GZ AGS/Zacatecas” (3) y “GZ SLP/AGS/Zacatecas” (35)."],
   [647,"Columnas sin información","Validación y HUB están vacías en todos los registros."]];
  const row=i=>`<div class="issue"><div class="cnt">${fmt(i[0])}</div><div><h4>${i[1]}</h4><p>${i[2]}</p></div></div>`;
  return `<div class="grid"><div class="v c12"><h3>Revisión con los datos actuales</h3>${it.map(row).join("")}</div>
   <div class="v c12"><h3>Revisión del archivo de audiencia original (7 oct)</h3>${orig?"":`<p class="hint">Estos puntos corresponden al archivo original; con los datos cargados pueden haber cambiado.</p>`}${st.map(row).join("")}</div></div>`;
}
function statusBar(){
  const el=document.getElementById("datastatus");if(!el)return;
  el.innerHTML=`<span>${esc(D.src||"")}${D.loaded?" · "+esc(D.loaded.join(" · ")):""}</span>${D.loaded?'<button id="restore" class="linkbtn">Volver a los datos originales</button>':""}`;
  const r=document.getElementById("restore");if(r)r.onclick=()=>{try{localStorage.removeItem(STORE)}catch(e){}hydrate(D0);render()};
}
function render(){
  slicers();ctx();nav();statusBar();
  const m=document.getElementById("main");
  m.innerHTML={universo:pUniverso,piloto:pPiloto,cobertura:pCobertura,resultados:pResultados,calidad:pCalidad}[S.page]();
  m.querySelectorAll(".hr.click").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(S.page==="piloto")S.pgz=S.pgz===k?null:k;else S.gz=S.gz===k?null:k;render()});
}
/* ===== botones ===== */
function b64ToBytes(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function setupIO(){
  const inp=document.getElementById("fileinp"),msg=document.getElementById("loadmsg");
  document.getElementById("btnload").onclick=()=>inp.click();
  inp.onchange=async()=>{if(!inp.files.length)return;msg.className="loadmsg";msg.textContent="Leyendo archivos…";
    try{const {found,warn}=await loadFiles([...inp.files]);
      msg.className="loadmsg "+(found.length?"ok":"bad");
      msg.innerHTML=(found.length?`<b>Datos actualizados:</b> ${esc(found.join(" · "))}.`:"<b>No se actualizó nada.</b>")+(warn.length?` <span>${warn.map(esc).join(" ")}</span>`:"");
      S.dr.clear();S.pos.clear();S.gz=null;S.pgz=null;render()}
    catch(e){msg.className="loadmsg bad";msg.textContent="No se pudo leer el archivo: "+e.message}
    inp.value=""};
  const tb=document.getElementById("btntpl");tb.hidden=false;let dl=null;
  (async()=>{try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}})();
  const FN="Plantilla_carga_tablero_Contract_Simulator.xlsx";
  tb.onclick=async()=>{
    const blob=new Blob([b64ToBytes(TPL_B64)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    if(dl){try{await dl.save({filename:FN,data:blob})}catch(e){if(e&&e.code&&e.code!=="declined"){msg.className="loadmsg bad";msg.textContent="No se pudo descargar la plantilla en esta vista."}}return}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=FN;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
}
setupIO();render();
</script>
